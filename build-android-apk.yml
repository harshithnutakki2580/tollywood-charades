name: Build Tollywood Charades Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp tollywood-charades.html www/index.html || cp index.html www/index.html

      - name: Initialize Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Tollywood Charades" "com.tollywood.charades" --web-dir www
          npx cap add android
          npx cap sync android
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); perm="<uses-permission android:name=\"android.permission.INTERNET\" />"; s=s.replace("<application", perm+"\n    <application") if perm not in s else s; open(p,"w").write(s)'
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Tollywood-Charades-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
